name: Bug report
description: Something is broken, or a helper script fails
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach private data, live credentials, or malware samples.
        Describe the artifact and share a redacted sample only if you are allowed to.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact command, the output, and your OS and Python version.
      placeholder: |
        Command: python skills/reverse-engineering/scripts/triage.py sample.bin
        Output: ...
        OS: Ubuntu 24.04 / Python 3.12
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: main @ abc1234
    validations:
      required: false
